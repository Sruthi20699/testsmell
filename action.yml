name: testsmell
description: Find test smells in Python test suites (tests that pass without really testing anything)
author: Sruthi20699
branding:
  icon: check-square
  color: green

inputs:
  paths:
    description: Space-separated files or folders to scan
    required: false
    default: "."
  exclude:
    description: Space-separated glob patterns to skip, e.g. "tests/fixtures/*"
    required: false
    default: ""
  fail-on:
    description: Fail the step when a finding has at least this severity (info, warning, error)
    required: false
    default: warning
  report:
    description: Optional path for an HTML report (upload it with actions/upload-artifact)
    required: false
    default: ""
  python-version:
    description: Python version used to run testsmell
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install testsmell
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Run testsmell
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_REPORT: ${{ inputs.report }}
      run: |
        read -ra paths <<< "$INPUT_PATHS"
        args=()
        read -ra patterns <<< "$INPUT_EXCLUDE"
        for p in "${patterns[@]}"; do args+=(--exclude "$p"); done
        if [ -n "$INPUT_REPORT" ]; then
          testsmell check "${paths[@]}" "${args[@]}" --format html --output "$INPUT_REPORT" || true
        fi
        testsmell check "${paths[@]}" "${args[@]}" --format github --fail-on "$INPUT_FAIL_ON"

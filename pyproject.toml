[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testsmell"
version = "0.1.0"
description = "Find test smells in Python test suites: tests that pass without really testing anything"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
testsmell = "testsmell.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testsmell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures holds deliberately smelly sample files, not real tests
norecursedirs = [".*", "build", "dist", "*.egg", "venv", "fixtures"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["tests/fixtures"]

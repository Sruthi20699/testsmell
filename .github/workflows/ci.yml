name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: testsmell checks its own tests
        run: testsmell check tests -e "tests/fixtures/*" --fail-on info

  action:
    # Exercise action.yml itself against the fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean fixture passes
        uses: ./
        with:
          paths: tests/fixtures/clean
          fail-on: info

      - name: Smelly fixture fails
        id: smelly
        uses: ./
        continue-on-error: true
        with:
          paths: tests/fixtures
          exclude: "*/clean/*"
          report: testsmell-report.html

      - name: Check the smelly run failed and wrote a report
        shell: bash
        env:
          OUTCOME: ${{ steps.smelly.outcome }}
        run: |
          test "$OUTCOME" = "failure"
          grep -q "TS004" testsmell-report.html

      - uses: actions/upload-artifact@v4
        with:
          name: testsmell-report
          path: testsmell-report.html
